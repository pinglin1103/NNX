<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動識字小教室 by NNX</title>
<style>
:root{
  --bg:#EDE7E0; --paper:#FAF7F3; --ink:#5A524D; --soft:#8C827B; --line:#D9CFC5;
  --rose:#C9A5A0; --sage:#A3B19B; --blue:#98A9B6; --mauve:#B3A2B8; --ochre:#CFB592;
  --ok:#8FA98A; --bad:#C48E8A; --hl:#F1E6C9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.kai{font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC","STKaiti",serif}
button{font-family:inherit}
/* 設定列 */
.ctl{position:sticky;top:0;z-index:5;background:#F4F0EA;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ctl .brand{font-weight:bold;color:#7B8E9B;font-size:16px}
.ctl .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl .grp b{font-size:13px;color:var(--soft)}
.ctl select,.ctl .vb{font-size:15px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.ctl .vb.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.ctl .tgl{margin-left:auto;font-size:13px;border:1px solid #B9C4CC;background:#E3EAEE;color:#4F6270;border-radius:8px;padding:5px 10px;cursor:pointer}
.ctl.min .grp{display:none}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:4px 0;font-size:clamp(20px,3.2vw,32px);letter-spacing:1px}
h1 .u{color:#B07F78}
h1 small{font-size:.48em;color:var(--soft);font-weight:normal;margin-left:6px}
.stars{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:20px;font-weight:bold}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
nav button{flex:1 1 150px;border:none;border-radius:14px 14px 0 0;padding:12px 10px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;opacity:.72;transition:.15s}
nav button.on{opacity:1;transform:translateY(-3px)}
nav button:nth-child(1){background:var(--rose)} nav button:nth-child(2){background:var(--ochre)}
nav button:nth-child(3){background:var(--sage)} nav button:nth-child(4){background:var(--mauve)}
nav button:nth-child(5){background:var(--blue)}
main{background:var(--paper);border-radius:0 0 18px 18px;padding:20px;min-height:520px;border:2px solid var(--line);border-top:none}
section{display:none} section.on{display:block}
.tip{color:var(--soft);margin:0 0 14px;font-size:17px}
/* 注音 */
.w{display:inline-flex;align-items:center;gap:2px}
.rb{display:inline-flex;align-items:center}
.zy{writing-mode:vertical-rl;text-orientation:upright;font-size:.36em;line-height:1;letter-spacing:-1px;margin-left:2px;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-weight:normal}
.blank{display:inline-block;width:1em;height:1em;border:3px dashed var(--ochre);border-radius:6px;background:#FFF9EC;vertical-align:middle}
/* 認識生字 */
.learn{display:grid;grid-template-columns:.9fr 1.1fr 1.6fr;gap:16px}
.col h3{margin:0 0 8px;color:var(--soft);font-size:17px}
.list{display:flex;flex-direction:column;gap:8px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:32px;cursor:pointer;text-align:left;color:var(--ink);transition:.12s}
.card:hover{border-color:var(--ochre)}
.card.on{background:var(--hl);border-color:var(--ochre)}
.words .card{font-size:28px}
.detail{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:64px;align-self:start}
.spk{border:none;background:var(--ochre);color:#fff;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;flex:none}
.spk.sm{width:34px;height:34px;font-size:15px}
.dtop{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:bold}
.dmain{display:flex;align-items:center;gap:16px;margin:14px 0;flex-wrap:wrap}
.big{font-size:76px;border:3px solid var(--blue);border-radius:14px;padding:4px 16px;background:#F6F8F9}
.pic{font-size:92px;line-height:1}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.fact{background:#F2EEF4;border-radius:10px;padding:4px 12px;font-size:18px}
.fact b{color:#7D6E85}
.mean{font-size:20px;margin:6px 0 14px;line-height:1.6}
.ext{background:#FBF6EE;border:2px solid #EADBC4;border-radius:12px;padding:10px 12px}
.ext>b{display:inline-block;background:var(--ochre);color:#fff;border-radius:8px;padding:2px 10px;margin-bottom:8px}
.extrow{display:flex;gap:18px;flex-wrap:wrap}
.extitem{display:flex;align-items:center;gap:6px;font-size:30px;cursor:pointer}
.extitem .e{font-size:34px;display:inline-flex}
.im{display:block;border-radius:10px;object-fit:contain}
.pic .im{width:170px;max-height:140px}
.extitem .im{width:56px;height:44px}
.mpic .im{width:84px;height:72px}
.qpic .im{width:220px;height:170px;margin:0 auto}
/* 配對 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:780px;margin:0 auto}
.mcol{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.mpic,.mword{background:#fff;border:3px solid var(--line);border-radius:14px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:.12s;padding:6px}
.mpic{font-size:54px;gap:2px}
.mpic .sub{font-size:24px}
.mpic .ear{font-size:44px}
.mpic .ear small{display:block;font-size:15px;color:var(--soft);text-align:center}
.mword{font-size:52px}
.mpic.sel,.mword.sel{border-color:var(--ochre);background:var(--hl);transform:scale(1.04)}
.mpic.done,.mword.done{border-color:var(--ok);background:#EEF3EC;cursor:default;opacity:.85}
.mword.over{border-style:dashed;border-color:var(--ochre)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.bar{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:10px 22px;font-size:20px;font-weight:bold;color:#fff;background:var(--sage);cursor:pointer}
.btn.alt{background:var(--blue)} .btn.rose{background:var(--rose)} .btn.mauve{background:var(--mauve)}
.msg{text-align:center;font-size:24px;font-weight:bold;min-height:36px;margin-top:12px}
.msg.ok{color:#6E8C68} .msg.bad{color:#B07772}
/* 測驗、回想 */
.q{max-width:660px;margin:0 auto;text-align:center}
.qpic{font-size:110px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;margin-bottom:8px;display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:150px}
.qword{font-size:54px;margin:6px 0 4px;display:flex;justify-content:center;align-items:center;gap:12px}
.qnum{color:var(--soft);font-size:18px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px;font-size:52px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:#EEF3EC}
.opt:disabled{opacity:.3;cursor:not-allowed}
.opt.shuf{animation:shuf .6s}
@keyframes shuf{30%{transform:rotate(-8deg) scale(.9)}60%{transform:rotate(8deg) scale(.9)}}
.opt.pop{animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.rin{font-size:56px;padding:4px 10px;border:3px solid var(--line);border-radius:12px;width:120px;text-align:center;color:var(--ink)}
.rin:focus{outline:none;border-color:var(--mauve)}
.hint{font-size:24px;color:var(--soft);min-height:40px;margin-top:8px}
.hint .gh{font-size:70px;color:#D8CEC5}
/* 生字練習 */
.pgrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pc{width:70px;height:70px;font-size:46px;background:#fff;border:3px solid var(--line);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.pc.on{border-color:var(--blue);background:#EEF2F5}
.pc.fin::after{content:"⭐";font-size:15px;position:absolute;top:-8px;right:-6px}
.board{position:relative;width:min(400px,88vw);aspect-ratio:1;margin:0 auto;background:#fff;border:4px solid var(--rose);border-radius:8px;touch-action:none}
.board .grid{position:absolute;inset:0;background:
  linear-gradient(to right,transparent calc(50% - 1px),#E3C9C5 calc(50% - 1px),#E3C9C5 calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(to bottom,transparent calc(50% - 1px),#E3C9C5 calc(50% - 1px),#E3C9C5 calc(50% + 1px),transparent calc(50% + 1px));}
.board .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(310px,68vw);color:#E9E2DC;line-height:1;user-select:none;pointer-events:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.pinfo{text-align:center;font-size:28px;margin-bottom:8px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.pinfo .fact{font-size:17px}
@media (max-width:880px){.learn{grid-template-columns:1fr 1fr}.detail{grid-column:1/-1;position:static;order:-1}.match{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}}
.confetti{position:fixed;font-size:34px;pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translateY(-160px) scale(1.4);opacity:0}}

/* ===== 皮克斯 3D 黏土風 ===== */
:root{--bg:#F3E6D3;--paper:#F8EEDF;--ink:#5B4636;--soft:#9A8571;--line:#E6D5BF;
 --rose:#D9928A;--ochre:#E1A866;--sage:#86B8AA;--blue:#8E9CCB;--mauve:#B896C2}
body{background:radial-gradient(circle at 30% 20%,#FBF3E6,#F0E1CB 70%);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;min-height:100vh}
.clay,.card,.mpic,.mword,.opt,.pc,.big,.qpic,.stars,.fact{border:none!important;background:linear-gradient(180deg,#FFFDF8,#F4EADC)!important;
 box-shadow:0 5px 0 #E2D0B8,0 10px 18px rgba(130,95,60,.18),inset 0 2px 1px #fff,inset 0 -3px 6px rgba(180,150,110,.12)!important;transition:transform .12s,box-shadow .12s}
.card,.mpic,.mword,.opt,.pc{border-radius:18px!important}
.card:active,.mpic:active,.mword:active,.opt:active,.pc:active{transform:translateY(3px);box-shadow:0 2px 0 #E2D0B8,0 4px 8px rgba(130,95,60,.18),inset 0 2px 1px #fff!important}
.card.on,.mpic.sel,.mword.sel,.pc.on{background:linear-gradient(180deg,#F6DDB5,#E9C690)!important;box-shadow:0 5px 0 #CFA66C,0 10px 18px rgba(150,100,40,.25),inset 0 2px 2px #FFF4DE!important}
.mpic.done,.mword.done,.opt.ok{background:linear-gradient(180deg,#E3F0DD,#C9E0BF)!important;box-shadow:0 5px 0 #A7C69A,0 8px 14px rgba(90,130,80,.2),inset 0 2px 1px #fff!important}
main{background:linear-gradient(180deg,#F8EEDF,#F2E3CE);border:none;border-radius:0 0 30px 30px;box-shadow:inset 0 3px 8px rgba(160,120,80,.15),0 14px 30px rgba(120,85,50,.18);position:relative}
nav button{border-radius:22px 22px 0 0;text-shadow:0 2px 2px rgba(0,0,0,.18);box-shadow:inset 0 3px 2px rgba(255,255,255,.45),inset 0 -6px 10px rgba(0,0,0,.08),0 -2px 8px rgba(120,85,50,.12)}
nav button:nth-child(1){background:linear-gradient(180deg,#E7A59C,#D18A81)} nav button:nth-child(2){background:linear-gradient(180deg,#EDBA7B,#DA9C55)}
nav button:nth-child(3){background:linear-gradient(180deg,#9CCABD,#79AD9F)} nav button:nth-child(4){background:linear-gradient(180deg,#A3AFD9,#8190C2)}
nav button:nth-child(5){background:linear-gradient(180deg,#CBA9D4,#AD88B9)}
.detail{background:linear-gradient(180deg,#FBF4EA,#F3E7D6);border:none;border-radius:26px;box-shadow:0 8px 0 #E2D0B8,0 16px 28px rgba(130,95,60,.2),inset 0 2px 2px #fff}
.big{border-radius:22px!important;padding:6px 20px}
.spk{background:radial-gradient(circle at 35% 30%,#F7C987,#E09A45);box-shadow:0 4px 0 #C27E35,0 8px 12px rgba(160,100,40,.3),inset 0 2px 2px rgba(255,255,255,.6)}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #C27E35}
.btn{border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.15),0 10px 16px rgba(120,85,50,.2),inset 0 3px 2px rgba(255,255,255,.4);text-shadow:0 2px 2px rgba(0,0,0,.15)}
.btn{background:linear-gradient(180deg,#9CCABD,#79AD9F)} .btn.alt{background:linear-gradient(180deg,#A3AFD9,#8190C2)}
.btn.rose{background:linear-gradient(180deg,#E7A59C,#D18A81)} .btn.mauve{background:linear-gradient(180deg,#CBA9D4,#AD88B9)}
.btn:active{transform:translateY(3px)}
.ext{background:linear-gradient(180deg,#FFF7EA,#F7E8D2);border:none;border-radius:20px;box-shadow:inset 0 2px 6px rgba(170,130,80,.18)}
.ext>b{background:linear-gradient(180deg,#EDBA7B,#DA9C55);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 #C27E35}
.im{border-radius:16px;box-shadow:0 6px 14px rgba(120,85,50,.22)}
.pic .im{width:190px;max-height:160px}
.qpic{border-radius:26px!important}
.rin{border:none;border-radius:18px;background:#fff;box-shadow:inset 0 3px 8px rgba(150,110,70,.25)}
.board{border:none;border-radius:22px;box-shadow:0 8px 0 #D9B7B1,0 14px 24px rgba(130,95,60,.2),inset 0 0 0 4px #E7C3BD}
.blank{border-color:#E1A866;background:#FFF1DA;border-radius:10px}
h1{color:#5B4636;text-shadow:0 2px 0 #fff}
h1 .u{color:#C9776E}
.ctl{background:rgba(250,243,232,.92);backdrop-filter:blur(6px)}
.ctl .vb.on{background:linear-gradient(180deg,#9CCABD,#79AD9F);border-color:transparent;color:#fff}
.mascot{width:150px;height:auto;margin-top:12px;filter:drop-shadow(0 6px 8px rgba(120,85,50,.28));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;font-size:22px;opacity:.85;filter:drop-shadow(0 3px 2px rgba(120,85,50,.25))}
.wrap,.ctl{position:relative;z-index:1}

/* 直式語詞（有格子） */
.vw{display:inline-flex;flex-direction:column;vertical-align:middle;background:#fff;border-radius:6px}
.vc{display:flex;align-items:center;justify-content:flex-start;width:1.72em;height:1.25em;border:2px solid #CDAE93;margin-top:-2px;padding-left:.06em;gap:.02em}
.vc:first-child{margin-top:0;border-radius:6px 6px 0 0}.vc:last-child{border-radius:0 0 6px 6px}.vc:only-child{border-radius:6px}
.vc .ch{width:1.12em;text-align:center;line-height:1}
.vc .zy{font-size:.3em;margin:0;letter-spacing:-1px}
.vc .blank{width:.95em;height:.95em;margin-left:.08em}
#wordList{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:12px}
#wordList .card{font-size:34px;padding:10px 12px}
.extitem .vw{font-size:30px}

/* ===== 平板、手機版面（電腦版不受影響） ===== */
button,.card,.mpic,.mword,.opt,.pc{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:1024px){
  nav{flex-wrap:nowrap;gap:6px}
  nav button{flex:1 1 0;min-width:0;font-size:18px;padding:10px 4px}
  .ctl{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .board{width:min(440px,100%)}
  .match{grid-template-columns:1fr 1fr;gap:16px}
}
@media (max-width:600px){
  .deco{display:none}
  body{background:#F6EBDB}
  .ctl{position:relative;padding:8px 12px;gap:8px}
  .ctl .brand{font-size:14px;flex:1 1 auto}
  .ctl .grp{width:100%}
  .ctl .grp b{width:34px}
  .ctl .grp select{flex:1;min-width:0;font-size:16px}
  .ctl #qrBtn,.ctl .tgl{font-size:13px;padding:5px 9px;margin-left:0}
  .wrap{padding:8px 10px 24px}
  header{flex-wrap:nowrap;gap:8px}
  h1{font-size:19px;line-height:1.35;margin:2px 0}
  h1 small{display:none}
  .stars{font-size:16px;padding:4px 12px;flex:none}
  nav{position:sticky;top:0;z-index:4;margin-top:8px;gap:4px;background:#F6EBDB;padding-top:4px}
  nav button span{display:block}
  .slogan{display:none}
  nav button{font-size:13px;line-height:1.25;padding:7px 2px 6px;border-radius:14px 14px 0 0;white-space:normal;transform:none!important}
  nav button.on{opacity:1;box-shadow:inset 0 -4px 0 rgba(255,255,255,.75)}
  main{padding:12px;min-height:0;border-radius:0 0 20px 20px}
  .tip{font-size:15px;margin-bottom:10px}
  /* 認識生字 */
  .learn{grid-template-columns:1fr 1fr;gap:10px}
  .detail{padding:12px;border-radius:20px}
  .dmain{gap:10px;margin:8px 0}
  .big{font-size:58px}
  .pic{font-size:64px}.pic .im{width:120px;max-height:100px}
  .mean{font-size:17px;margin:4px 0 10px}
  .fact{font-size:15px}
  .extitem{font-size:24px}.extitem .vw{font-size:24px}
  .mascot{display:none}
  .card{font-size:28px;padding:4px 8px}
  #wordList{gap:8px}#wordList .card{font-size:26px;padding:6px 8px}
  /* 看圖配對：圖在左、字在右 */
  .match{grid-template-columns:1fr 1fr;gap:10px}
  .mcol{grid-template-columns:1fr;gap:8px}
  .mpic,.mword{min-height:76px}
  .mpic{font-size:40px}.mpic .im{width:70px;height:58px}.mpic .sub{font-size:20px}
  .mword{font-size:40px}
  /* 測驗、回想 */
  .qpic{font-size:76px;min-width:150px;min-height:110px;padding:6px}
  .qpic .im{width:170px;height:130px}
  .qword{font-size:42px}
  .opts{grid-template-columns:1fr 1fr;gap:8px}
  .opt{font-size:42px;padding:4px}
  .rin{font-size:44px;width:100px}
  .msg{font-size:19px}
  .bar{gap:8px;margin-top:12px}
  .btn{font-size:16px;padding:9px 16px}
  /* 生字練習 */
  .pgrid{gap:6px;margin-bottom:10px}
  .pc{width:50px;height:50px;font-size:32px;border-radius:14px!important}
  .pinfo{font-size:24px;gap:8px}
  .board .ghost{font-size:min(310px,72vw)}
  #write .bar{display:grid;grid-template-columns:1fr 1fr}
  #write .bar .btn{padding:10px 6px}
}
@media (max-width:360px){nav button{font-size:12px}h1{font-size:17px}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<div class="ctl" id="ctl">
  <span class="brand">互動識字小教室 by NNX</span>
  <div class="grp"><b>版本</b><span id="verBox"></span></div>
  <div class="grp"><b>年級</b><select id="grSel"></select></div>
  <div class="grp"><b>課次</b><select id="lesSel"></select></div>
  <button class="vb" id="qrBtn" style="background:linear-gradient(180deg,#EDBA7B,#DA9C55);color:#fff;border:none">📱 QR code</button>
  <button class="tgl" id="tgl">收合設定 ▲</button>
</div>
<div id="qrBox" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(90,70,54,.45);align-items:center;justify-content:center">
 <div style="background:linear-gradient(180deg,#FFFDF8,#F4EADC);border-radius:28px;padding:24px 28px;text-align:center;box-shadow:0 10px 0 #E2D0B8,0 20px 40px rgba(0,0,0,.25);max-width:92vw">
  <div id="qrTitle" style="font-size:24px;margin-bottom:12px"></div>
  <div id="qrImg" style="background:#fff;padding:14px;border-radius:18px;display:inline-block"></div>

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/'/g,"\\'");
function zyH(text,z,blank){const zs=(z||"").split(" ");return `<span class="w kai">${[...text].map((c,i)=>`<span class="rb">${blank&&c===blank?'<span class="blank"></span><span class="zy"></span>':c+`<span class="zy">${zs[i]||""}</span>`}</span>`).join("")}</span>`}
function zyV(text,z,blank){const zs=(z||"").split(" ");return `<span class="vw kai">${[...text].map((c,i)=>blank&&c===blank?'<span class="vc"><span class="blank"></span></span>':`<span class="vc"><span class="ch">${c}</span><span class="zy">${zs[i]||""}</span></span>`).join("")}</span>`}
function img(key){return IMG[key]?`<img src="${IMG[key]}" alt="${key}" class="im">`:""}
function picOfChar(c){return img(c)||W[c]?.e||""}
function picOfWord(w){return img(w.t)||w.p||""}
let stars=0;function addStar(n,el){stars+=n;$("star").textContent=stars;if(el){const r=el.getBoundingClientRect();const s=document.createElement("div");s.className="confetti";s.textContent="⭐";s.style.left=(r.left+r.width/2-17)+"px";s.style.top=r.top+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
let tw=null;
function pickVoice(){const vs=speechSynthesis.getVoices();tw=vs.find(v=>/zh[-_]TW/i.test(v.lang)&&/Hanhan|Yating|Zhiwei|HsiaoChen|HsiaoYu|Mei-Jia|Meijia|美佳|雅婷|曉臻/i.test(v.name))||vs.find(v=>/zh[-_]TW/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";if(tw)u.voice=tw;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ===== 目前課次 ===== */
let V="ny",G="1a",L=1,CH=[],WORDS=[];
function lessonData(){const les=BOOKS[V].g[G].les[L];
  CH=les[1].split("\n").map(l=>{const [c,z,b,p,e]=l.split("|");const ety=e?e.replace(" ","|"):ETY[c];return{c,z,b,p,ety}});
  const seen=new Set();WORDS=[];
  CH.forEach(o=>(W[o.c]?.w||[]).forEach(w=>{if(!seen.has(w.t)){seen.add(w.t);WORDS.push({...w,from:o.c})}}));}
function fillSelectors(){
  $("verBox").innerHTML=Object.entries(BOOKS).map(([k,b])=>`<button class="vb${k===V?" on":""}" data-v="${k}">${b.name}</button>`).join("");
  $("grSel").innerHTML=Object.entries(BOOKS[V].g).map(([k,g])=>`<option value="${k}"${k===G?" selected":""}>${g.name}</option>`).join("");
  $("lesSel").innerHTML=Object.entries(BOOKS[V].g[G].les).map(([k,l])=>`<option value="${k}"${+k===L?" selected":""}>${lab(k)}${l[0]?"　"+l[0]:""}</option>`).join("");}
const lab=k=>+k===0?"識字單元":`第${k}課`;
function go(v,g,l,push=true){
  if(!BOOKS[v])v="ny";if(!BOOKS[v].g[g])g=Object.keys(BOOKS[v].g)[0];if(!BOOKS[v].g[g].les[l])l=BOOKS[v].g[g].les[1]?1:+Object.keys(BOOKS[v].g[g].les)[0];
  V=v;G=g;L=+l;fillSelectors();lessonData();
  const les=BOOKS[V].g[G].les[L];
  $("hUnit").textContent=`${BOOKS[V].name}${BOOKS[V].g[G].name}　${lab(L)}`;$("hName").textContent=les[0]?"　"+les[0]:"";
  document.title=`互動識字小教室 ${BOOKS[V].name}${BOOKS[V].g[G].name}${lab(L)} by NNX`;
  store.set("nnxLit",`${V}-${G}-${L}`);
  if(push){try{history.replaceState(null,"",`#${V}-${G}-${L}`)}catch(e){location.hash=`${V}-${G}-${L}`}}
  buildLearn();newMatch();newQuiz();newRecall();buildWrite();}
$("verBox").onclick=e=>{const b=e.target.closest(".vb");if(b)go(b.dataset.v,G,-1)};
$("grSel").onchange=e=>go(V,e.target.value,-1);
$("lesSel").onchange=e=>go(V,G,+e.target.value);
$("tgl").onclick=()=>{const m=$("ctl").classList.toggle("min");$("tgl").textContent=m?"展開設定 ▼":"收合設定 ▲"};
if(innerWidth<=600)$("tgl").onclick(); /* 手機先收合設定，畫面比較清爽 */
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1).split("-");if(p.length===3)go(p[0],p[1],+p[2],false)});

/* ===== 分頁 ===== */
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
  if(b.dataset.t==="write")sizeCanvas()};

/* ===== 1 認識生字 ===== */
function showChar(o,btn,quiet){
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("on",c===btn));
  const ws=W[o.c]?.w||[];const [kind,txt]=(o.ety||"").split("|");
  $("detail").innerHTML=`<div class="dtop"><button class="spk" onclick="say('${o.c}')">🔊</button>聽一聽</div>
  <div class="dmain"><div class="big">${zyH(o.c,o.z)}</div><div class="pic">${picOfChar(o.c)}</div></div>
  <div class="facts"><span class="fact"><b>部首</b> ${o.b}</span><span class="fact"><b>部件</b> ${o.p.replace(/\+/g," ＋ ")}</span>${kind?`<span class="fact"><b>造字</b> ${kind}</span>`:""}</div>
  ${txt?`<div class="mean">📖 字的故事：${txt}</div>`:""}
  <div class="ext"><b>延伸詞彙</b><div class="extrow">${ws.map(w=>`<div class="extitem" onclick="say('${w.t}')"><span class="e">${picOfWord(w)}</span>${zyV(w.t,w.z)}<button class="spk sm">🔊</button></div>`).join("")}</div></div>`;
  if(!quiet)say(o.c)}
function showWord(w,btn){
  document.querySelectorAll("#wordList .card").forEach(c=>c.classList.toggle("on",c===btn));
  const rel=WORDS.filter(x=>x.t!==w.t&&[...w.t].some(c=>x.t.includes(c))).slice(0,3);
  $("detail").innerHTML=`<div class="dtop"><button class="spk" onclick="say('${w.t}')">🔊</button>聽一聽</div>
  <div class="dmain"><div class="big" style="font-size:60px">${zyV(w.t,w.z)}</div><div class="pic">${picOfWord(w)}</div></div>
  <div class="mean">這個語詞裡有這課的生字「<b class="kai" style="font-size:1.4em">${w.from}</b>」。</div>
  ${rel.length?`<div class="ext"><b>還有這些語詞</b><div class="extrow">${rel.map(x=>`<div class="extitem" onclick="say('${x.t}')"><span class="e">${picOfWord(x)}</span>${zyV(x.t,x.z)}<button class="spk sm">🔊</button></div>`).join("")}</div></div>`:""}`;
  say(w.t)}
function buildLearn(){
  $("charList").innerHTML="";$("wordList").innerHTML="";
  CH.forEach((o,i)=>{const b=document.createElement("button");b.className="card";b.innerHTML=zyH(o.c,o.z);b.onclick=()=>{showChar(o,b);showWordsOf(o)};$("charList").appendChild(b)});
  $("wordList").innerHTML='<p class="tip">👈 先點一個生字，這裡會出現它的語詞。</p>';
  $("detail").innerHTML='<p class="tip" style="margin:0">點左邊的生字開始認識吧！</p>';}
function showWordsOf(o){$("wordList").innerHTML="";
  WORDS.filter(w=>w.from===o.c||w.t.includes(o.c)).forEach(w=>{const b=document.createElement("button");b.className="card";b.innerHTML=zyV(w.t,w.z);b.onclick=()=>showWord(w,b);$("wordList").appendChild(b)})}

/* ===== 2 看圖配對 ===== */
let selPic=null;
function clue(o){ // 字的提示卡：圖 → 語詞圖 → 聽聲音
  if(img(o.c)||W[o.c]?.e)return{html:picOfChar(o.c),say:o.c};
  const w=(W[o.c]?.w||[]).find(w=>picOfWord(w));
  if(w)return{html:`${picOfWord(w)}<span class="sub">${zyH(w.t,w.z,o.c)}</span>`,say:w.t};
  return{html:`<span class="ear">🔊<small>聽一聽</small></span>`,say:o.c};}
function newMatch(){
  const set=shuffle(CH).slice(0,6);let left=set.length;selPic=null;$("mMsg").textContent="";$("mMsg").className="msg";
  $("mPics").innerHTML="";$("mWords").innerHTML="";
  shuffle(set).forEach(o=>{const k=clue(o);const p=document.createElement("div");p.className="mpic";p.innerHTML=k.html;p.dataset.c=o.c;p.draggable=true;
    const pick=()=>{if(p.classList.contains("done"))return;document.querySelectorAll(".mpic").forEach(x=>x.classList.remove("sel"));p.classList.add("sel");selPic=p;say(k.say)};
    p.onclick=pick;p.ondragstart=e=>{if(p.classList.contains("done")){e.preventDefault();return}pick();e.dataTransfer.setData("text","x")};
    $("mPics").appendChild(p)});
  shuffle(set).forEach(o=>{const t=document.createElement("div");t.className="mword";t.innerHTML=zyH(o.c,o.z);
    const tryIt=()=>{if(!selPic||t.classList.contains("done"))return;
      if(selPic.dataset.c===o.c){selPic.classList.remove("sel");selPic.classList.add("done");t.classList.add("done");say(o.c);addStar(1,t);selPic=null;left--;
        $("mMsg").className="msg ok";$("mMsg").textContent=left?"答對了！👏":"全部配對成功！你好棒！🎉"}
      else{t.classList.add("shake");selPic.classList.add("shake");setTimeout(()=>document.querySelectorAll(".shake").forEach(x=>x.classList.remove("shake")),400);
        $("mMsg").className="msg bad";$("mMsg").textContent="不對喔！字卡重新洗牌，再仔細看一次！";
        setTimeout(()=>{const box=$("mWords");shuffle([...box.children]).forEach(n=>box.appendChild(n))},450)}};
    t.onclick=tryIt;t.ondragover=e=>{e.preventDefault();t.classList.add("over")};t.ondragleave=()=>t.classList.remove("over");t.ondrop=e=>{e.preventDefault();t.classList.remove("over");tryIt()};
    $("mWords").appendChild(t)});}
$("mNew").onclick=newMatch;

/* ===== 3 語詞測驗（看圖填字） ===== */
let qList=[],qi=0,qMiss=[],qRe=false;
function mkItems(){return shuffle(CH).filter(o=>W[o.c]).map(o=>{const ws=W[o.c].w;const withPic=ws.filter(w=>picOfWord(w));const w=shuffle(withPic.length?withPic:ws)[0];return{o,w}})}
function newQuiz(){qList=mkItems();qi=0;qMiss=[];qRe=false;showQ()}
function showQ(){const it=qList[qi];if(!it)return;const {o,w}=it;
  $("qNum").innerHTML=(qRe?"<b style='color:#C9776E'>🔁 重新練習</b>　":"")+`第 ${qi+1} / ${qList.length} 題`;
  $("qPic").innerHTML=picOfWord(w)||"🔊";$("qPic").style.display="";
  $("qWord").innerHTML=`${zyV(w.t,w.z,o.c)}<button class="spk" onclick="say('${w.t}')">🔊</button>`;
  $("qMsg").textContent="";$("qNext").style.display="none";
  const dis=shuffle(CH.filter(x=>x.c!==o.c&&!w.t.includes(x.c))).slice(0,3);
  const wrong=new Set();
  const render=()=>{$("qOpts").innerHTML="";shuffle([o,...dis]).forEach(x=>{const b=document.createElement("button");b.className="opt pop";b.innerHTML=zyH(x.c,x.z);
    if(wrong.has(x.c))b.disabled=true;
    b.onclick=()=>{if(x.c===o.c){b.classList.add("ok");document.querySelectorAll(".opt").forEach(y=>{if(y!==b)y.disabled=true});b.onclick=null;
        $("qWord").innerHTML=`${zyV(w.t,w.z)}<button class="spk" onclick="say('${w.t}')">🔊</button>`;
        $("qMsg").className="msg ok";$("qMsg").textContent="答對了！✔";say(w.t);addStar(wrong.size?0:1,b);if(wrong.size)$("qMsg").textContent="答對了！✔ 下次一次就選對喔！";$("qNext").style.display=""}
      else{if(!wrong.size)qMiss.push(it);wrong.add(x.c);say(x.c);$("qMsg").className="msg bad";$("qMsg").textContent="不是這個字喔！選項重新洗牌，再仔細看一次！";
        document.querySelectorAll(".opt").forEach(y=>{y.disabled=true;y.classList.add("shuf")});setTimeout(render,650)}};
    $("qOpts").appendChild(b)})};
  render();}
$("qNext").onclick=()=>{qi++;if(qi<qList.length)return showQ();
  if(qMiss.length){qList=shuffle(qMiss);qMiss=[];qi=0;qRe=true;showQ();$("qMsg").className="msg bad";$("qMsg").textContent=`剛剛有 ${qList.length} 題錯了，我們再練一次！💪`}
  else{newQuiz();$("qMsg").className="msg ok";$("qMsg").textContent="全部都會了！🎉 再玩一輪"}};

/* ===== 4 回想記憶（看圖寫字） ===== */
let rList=[],ri=0,rLv=0,rMiss=[],rRe=false,rBad=false;
function newRecall(){rList=mkItems();ri=0;rMiss=[];rRe=false;showR()}
function showR(){const it=rList[ri];if(!it)return;const {o,w}=it;rLv=0;rBad=false;
  $("rNum").innerHTML=(rRe?"<b style='color:#C9776E'>🔁 重新練習</b>　":"")+`第 ${ri+1} / ${rList.length} 題`;$("rPic").innerHTML=picOfWord(w)||"🔊";
  $("rWord").innerHTML=`${zyV(w.t,w.z,o.c)}<button class="spk" onclick="say('${w.t}')">🔊</button>`;
  $("rIn").value="";$("rHint").innerHTML="";$("rMsg").textContent="";$("rNext").style.display="none";$("rCheck").style.display=""}
$("rCheck").onclick=()=>{const {o,w}=rList[ri];const v=$("rIn").value.replace(/\s/g,"").replace(/靑/g,"青");
  if(!v){$("rMsg").className="msg bad";$("rMsg").textContent="先寫寫看喔！";return}
  if(v===o.c){$("rMsg").className="msg ok";$("rMsg").textContent=`答對了！就是「${o.c}」🎉`;say(w.t);addStar(rLv||rBad?0:2,$("rCheck"));if(rLv||rBad)rMiss.push(rList[ri]);
    $("rWord").innerHTML=`${zyV(w.t,w.z)}<button class="spk" onclick="say('${w.t}')">🔊</button>`;$("rNext").style.display="";$("rCheck").style.display="none"}
  else{rBad=true;$("rMsg").className="msg bad";$("rMsg").textContent="再想想看，也可以按「提示」！"}};
$("rIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)$("rCheck").click()});
$("rTip").onclick=()=>{const {o}=rList[ri];rLv++;
  if(rLv===1)$("rHint").textContent=`部首是「${o.b}」，部件：${o.p.replace(/\+/g," ＋ ")}`;
  else{$("rHint").innerHTML=`<span class="gh">${o.c}</span>`;say(o.c)}};
$("rNext").onclick=()=>{ri++;if(ri<rList.length)return showR();
  if(rMiss.length){rList=shuffle(rMiss);rMiss=[];ri=0;rRe=true;showR();$("rMsg").className="msg bad";$("rMsg").textContent=`有 ${rList.length} 題要再練一次，加油！💪`}
  else{newRecall();$("rMsg").className="msg ok";$("rMsg").textContent="全部自己寫對了！🎉 再來一輪"}};

/* ===== 5 生字練習 ===== */
let pi=0,ghostOn=true;const cv=$("cv"),ctx=cv.getContext("2d");
function buildWrite(){$("pGrid").innerHTML="";CH.forEach((o,i)=>{const d=document.createElement("div");d.className="pc";d.textContent=o.c;d.onclick=()=>setP(i);$("pGrid").appendChild(d)});setP(0,true)}
function setP(i,q){pi=i;document.querySelectorAll(".pc").forEach((x,j)=>x.classList.toggle("on",j===i));const o=CH[i];
  $("ghost").textContent=o.c;$("pInfo").innerHTML=`${zyH(o.c,o.z)} <button class="spk sm" onclick="say('${o.c}')">🔊</button><span class="fact"><b>部首</b> ${o.b}</span><span class="fact"><b>部件</b> ${o.p.replace(/\+/g," ＋ ")}</span>`;
  clearCv();if($("pMsg"))$("pMsg").textContent="";if(!q)say(o.c)}
function sizeCanvas(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=window.devicePixelRatio||1;
  strokes=[];cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#5A524D";ctx.lineWidth=Math.max(10,r.width/32)}
function clearCv(){ctx.clearRect(0,0,cv.width,cv.height);strokes=[]}
let drawing=false,last=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);strokes.push([last]);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill()});
cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;strokes[strokes.length-1].push(p)});
["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>drawing=false));
window.addEventListener("resize",()=>{if($("write").classList.contains("on"))sizeCanvas()});
$("pClear").onclick=()=>{clearCv();$("pMsg").textContent=""};
$("pGhost").onclick=()=>{ghostOn=!ghostOn;$("ghost").style.visibility=ghostOn?"visible":"hidden";$("pGhost").textContent="👀 描紅："+(ghostOn?"開":"關")};
/* 檢查寫的字：把孩子寫的和標準字都縮放到同樣大小再比對，亂畫、只點一下、寫歪掉都不會過 */
/* 檢查寫的字：記下每一筆，把孩子寫的和標準字都縮放到同樣大小再比對。
   亂畫（畫到字外面、塗滿、線太多）、只點一下、少寫很多筆畫都不會過。 */
const PN=56;let strokes=[];
/* 縮放：寬高各自撐滿格子，但不拉超過 1.7 倍，扁的字（一）不會被拉成方的 */
function fitS(bw,bh){let sx=(PN-8)/bw,sy=(PN-8)/bh;const k=1.7;if(sy>sx*k)sy=sx*k;if(sx>sy*k)sx=sy*k;return[sx,sy]}
function glyphMask(ch){const W=200,t=document.createElement("canvas");t.width=t.height=W;const x=t.getContext("2d");
  x.font=`${W*0.8}px ${getComputedStyle($("ghost")).fontFamily}`;x.textAlign="center";x.textBaseline="middle";x.fillText(ch,W/2,W/2);
  const d=x.getImageData(0,0,W,W).data;let x0=W,y0=W,x1=-1,y1=-1;for(let y=0;y<W;y++)for(let i=0;i<W;i++)if(d[(y*W+i)*4+3]>100){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;const bw=x1-x0+1,bh=y1-y0+1,[kx,ky]=fitS(bw,bh),ox=(PN-bw*kx)/2,oy=(PN-bh*ky)/2,m=new Uint8Array(PN*PN);
  for(let y=0;y<PN;y++)for(let i=0;i<PN;i++){const sx=Math.floor(x0+(i-ox)/kx),sy=Math.floor(y0+(y-oy)/ky);if(sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1&&d[(sy*W+sx)*4+3]>100)m[y*PN+i]=1}
  return{m,ar:bw/bh,big:Math.max(bw,bh)/W}}
function userMask(){const pts=strokes.flat();if(!pts.length)return null;const R=cv.getBoundingClientRect().width||1;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
  const bw=Math.max(x1-x0,R*0.02),bh=Math.max(y1-y0,R*0.02),[kx,ky]=fitS(bw,bh),ox=(PN-bw*kx)/2-x0*kx,oy=(PN-bh*ky)/2-y0*ky;
  const c=document.createElement("canvas");c.width=c.height=PN;const x=c.getContext("2d");x.lineWidth=2.2;x.lineCap=x.lineJoin="round";let len=0;
  strokes.forEach(s=>{x.beginPath();s.forEach((p,i)=>{const X=p.x*kx+ox,Y=p.y*ky+oy;i?x.lineTo(X,Y):x.moveTo(X,Y);if(i)len+=Math.hypot((p.x-s[i-1].x)*kx,(p.y-s[i-1].y)*ky)});if(s.length==1)x.lineTo(s[0].x*kx+ox+.1,s[0].y*ky+oy);x.stroke()});
  const d=x.getImageData(0,0,PN,PN).data,m=new Uint8Array(PN*PN);for(let i=0;i<PN*PN;i++)m[i]=d[i*4+3]>60?1:0;
  return{m,len,ar:bw/bh,big:Math.max(x1-x0,y1-y0)/R}}
function dilate(m,r){const o=new Uint8Array(PN*PN);for(let y=0;y<PN;y++)for(let x=0;x<PN;x++)if(m[y*PN+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<PN&&Y<PN&&dx*dx+dy*dy<=r*r)o[Y*PN+X]=1}return o}
function checkWrite(ch){
  const U=userMask();if(!U||U.big<0.08)return{ok:false,why:"empty"};
  const T=glyphMask(ch);if(!T)return{ok:true};
  if(U.big<0.3&&T.big>0.4)return{ok:false,why:"small"};
  const Td=dilate(T.m,2),Ud=dilate(U.m,3);let un=0,uin=0,tn=0,tin=0,per=0;
  for(let i=0;i<PN*PN;i++){if(U.m[i]){un++;if(Td[i])uin++}if(T.m[i]){tn++;if(Ud[i])tin++;const y=i/PN|0,x=i%PN;if(!(x&&y&&x<PN-1&&y<PN-1&&T.m[i-1]&&T.m[i+1]&&T.m[i-PN]&&T.m[i+PN]))per++}}
  const prec=uin/un,rec=tin/tn,tlen=per/2,lenR=U.len/tlen,cl=a=>Math.min(4,Math.max(.25,a)),arOk=Math.abs(Math.log(cl(U.ar)/cl(T.ar)))<Math.log(2.5);
  const P={p:.7,r:.7,l:1.6};
  const ok=prec>=P.p&&rec>=P.r&&lenR<=P.l&&arOk;
  return{ok,prec,rec,lenR,why:ok?"":(prec<P.p||lenR>P.l?"messy":(!arOk?"messy":"missing"))}}
function pMsg(t,ok){const m=$("pMsg");m.className="msg "+(ok?"ok":"bad");m.textContent=t}
$("pDone").onclick=()=>{const el=document.querySelectorAll(".pc")[pi],ch=CH[pi].c,r=checkWrite(ch);
  if(!r.ok){const tip={empty:"還沒有寫字喔！先寫寫看 ✏️",small:"字寫太小了，寫大一點，把格子填滿 📏",messy:"好像有多畫的地方，照著字的樣子再寫一次 🧽",missing:"好像少寫了一些筆畫，再看一看字 👀"}[r.why];
    pMsg(tip,false);say(tip.replace(/[^一-鿿，！、]/g,""));const b=document.querySelector("#write .board");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return}
  pMsg("寫對了！真棒 ⭐",true);if(!el.classList.contains("fin")){el.classList.add("fin");addStar(1,el)}say("寫得好棒！")};
$("pNext").onclick=()=>setP((pi+1)%CH.length);

/* 裝飾邊框與小幫手 */
(function(){const ic=["⭐","🐟","🍃","🫧","⭐","🐠","🌿"];let s="";const add=(x,y)=>s+=`<span style="left:${x}%;top:${y}%;transform:rotate(${Math.random()*40-20}deg)">${ic[Math.random()*ic.length|0]}</span>`;
 for(let i=2;i<98;i+=6){add(i,1);add(i,96)}for(let j=6;j<94;j+=7){add(.5,j);add(97.5,j)}$("deco").innerHTML=s;
 $("mascot").src=IMG._kid;})();

/* ===== QR code ===== */
const QR_DEFAULT="https://pinglin1103.github.io/NNX/shizi/";
function qrBase(){return (store.get("nnxLitQR")||QR_DEFAULT).replace(/#.*$/,"")}
function showQR(){const url=`${qrBase()}#${V}-${G}-${L}`;
  $("qrTitle").textContent=`${BOOKS[V].name}${BOOKS[V].g[G].name}　${lab(L)}　${BOOKS[V].g[G].les[L][0]||""}`;
  $("qrUrl").textContent=url;$("qrBase").value=qrBase();$("qrImg").innerHTML="";
  if(window.QRCode){new QRCode($("qrImg"),{text:url,width:260,height:260,colorDark:"#4A3A2E",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}
  else $("qrImg").textContent="QR code 載入失敗，請重新整理再試";
  $("qrBox").style.display="flex"}
$("qrBtn").onclick=showQR;$("qrClose").onclick=()=>$("qrBox").style.display="none";
$("qrBox").onclick=e=>{if(e.target===$("qrBox"))$("qrBox").style.display="none"};
$("qrBase").onchange=e=>{store.set("nnxLitQR",e.target.value.trim()||QR_DEFAULT);showQR()};

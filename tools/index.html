<style>

:root{

  --sage:#8fa58f; --rose:#c49a94; --blue:#8c9fb3; --sand:#c8b18d; --plum:#a08ca6; --clay:#b38b72;
  --accent:#6f8a72; --accent-ink:#ffffff; --focus:#d4a95c; --danger:#a5574a;
  --f-display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#22201e; --paper:#2c2927; --ink:#ece6df; --muted:#ada49b; --line:#433e3a;
  --sage:#7f957f; --rose:#a9807a; --blue:#7c8ea2; --sand:#a8946f; --plum:#8d7a93; --clay:#9c7660;
  --accent:#93ad95; --accent-ink:#1b1f1b; --focus:#e0b86a; --danger:#d98a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#22201e; --paper:#2c2927; --ink:#ece6df; --muted:#ada49b; --line:#433e3a;
  --sage:#7f957f; --rose:#a9807a; --blue:#7c8ea2; --sand:#a8946f; --plum:#8d7a93; --clay:#9c7660;
  --accent:#93ad95; --accent-ink:#1b1f1b; --focus:#e0b86a; --danger:#d98a7c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 72px}
header{display:grid;gap:10px;margin-bottom:26px}
.eyebrow{font-size:.85rem;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.15;margin:0;text-wrap:balance}
h1 .by{font-family:var(--f-body);font-size:.36em;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-left:.6em;vertical-align:middle;white-space:nowrap}
.lead{margin:0;color:var(--muted);max-width:60ch}
.stripe{display:flex;height:6px;border-radius:999px;overflow:hidden;max-width:260px}
.stripe i{flex:1}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;width:min(100%,240px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.filters{display:grid;gap:8px;min-width:0}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flabel{font-size:.85rem;color:var(--muted);letter-spacing:.08em;min-width:3.5em}
.chip.big{font-weight:700}
.groups{display:grid;gap:28px}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-family:var(--f-display);font-size:1.5rem}
.grp-h small{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.card .top{padding:18px 18px 0;display:flex;gap:14px;align-items:flex-start}
.mark{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:#fff}
.card h3.tn{font-family:var(--f-display);font-size:1.3rem;line-height:1.35;margin:2px 0 4px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.who{border-color:transparent;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.card p{margin:12px 18px 0;color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.card .foot{margin-top:auto;padding:16px 18px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.open{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;padding:8px 18px;border-radius:999px}
.open:hover{background:var(--accent);color:var(--accent-ink)}
.ed{display:none;gap:6px;flex-wrap:wrap}
.managing .ed{display:flex}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:18px}
.manage{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.manage .note{color:var(--muted);font-size:.9rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px;display:grid;gap:12px}
.panel h3{margin:0;font-family:var(--f-display);font-size:1.25rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{font:inherit;font-size:.98rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.form textarea{resize:vertical;min-height:4.2em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{min-height:1.5em;font-size:.92rem;color:var(--muted);margin:0}
.status.err{color:var(--danger)}.status.ok{color:var(--accent)}
.unsaved{display:inline-block;font-size:.8rem;background:var(--focus);color:#2b2620;border-radius:999px;padding:1px 10px;margin-left:6px}
[hidden]{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center}
</style>

<div class="wrap" id="app">
  <header>
    <span class="eyebrow">特教老師的 AI 小工具</span>
    <h1>教學工具箱<span class="by">by NNX</span></h1>
    <p class="lead">我用 AI 做的教學小工具，都放在這裡。點「打開」就能直接使用；平板、電腦都可以。</p>
    <div class="stripe" aria-hidden="true"><i style="background:var(--sage)"></i><i style="background:var(--rose)"></i><i style="background:var(--blue)"></i><i style="background:var(--sand)"></i><i style="background:var(--plum)"></i></div>
  </header>

  <section class="panel" id="form-panel" hidden aria-labelledby="form-title">
    <h3 id="form-title">新增工具</h3>
    <form class="form" id="tool-form">
      <label for="f-name">工具名稱<input id="f-name" required maxlength="40" placeholder="例如：注音打字小高手"></label>
      <label for="f-url">連結<input id="f-url" required type="url" placeholder="https://claude.ai/artifact/…"></label>
      <label for="f-cat">科目<input id="f-cat" list="cat-list" maxlength="12" placeholder="例如：數學"><datalist id="cat-list"></datalist></label>
      <label for="f-who">給誰用<select id="f-who"><option value="學生用">學生用</option><option value="老師用">老師用</option><option value="親師共用">親師共用</option></select></label>
      <label for="f-desc" class="wide">一句話介紹<textarea id="f-desc" maxlength="120" placeholder="這個工具可以做什麼"></textarea></label>
      <div class="row wide"><button type="submit" class="btn primary" id="f-submit">加入清單</button><button type="button" class="btn" id="f-cancel">取消</button></div>
    </form>
  </section>

  <div class="controls">
    <div class="filters">
      <div class="frow"><span class="flabel">給誰用</span><div class="chips" id="who-chips" role="group" aria-label="給誰用"></div></div>
      <div class="frow"><span class="flabel">科目</span><div class="chips" id="chips" role="group" aria-label="科目"></div></div>
    </div>
    <input class="search" id="q" type="search" placeholder="搜尋工具" aria-label="搜尋工具">
  </div>
  <div class="groups" id="grid"></div>

  <div class="manage" id="manage" hidden>
    <span class="note" id="manage-note">只有你看得到這一區。</span>
    <div class="row">
      <button type="button" class="btn" id="m-toggle">管理工具</button>
      <button type="button" class="btn" id="m-add" hidden>＋ 新增工具</button>
      <button type="button" class="btn primary" id="m-save" hidden>儲存網站</button>
    </div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <footer>教學工具箱 by NNX</footer>
</div>

function initial(n){ var s = String(n || "").replace(/^[\s\d一二三四五六上下:：、.]+/, ""); return Array.from(s || n || "?")[0]; }
function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? u : "#"; }
function status(m, c){ var s = $("status"); s.textContent = m || ""; s.className = "status" + (c ? " " + c : ""); }

function renderChips(){
  var wl = ["全部"].concat(whos()); if (wl.indexOf(who) < 0) who = "全部";
  $("who-chips").innerHTML = wl.map(function(w){
    var n = w === "全部" ? tools.length : tools.filter(function(t){ return (t.who || "學生用") === w; }).length;
    return '<button type="button" class="chip big" data-who="' + esc(w) + '" aria-pressed="' + (w === who) + '">' + esc(w) + "<small>" + n + "</small></button>";
  }).join("");
  var pool = tools.filter(inWho), sub = [];
  pool.forEach(function(t){ if (t.cat && sub.indexOf(t.cat) < 0) sub.push(t.cat); });
  var list = ["全部"].concat(sub);
  if (list.indexOf(cat) < 0) cat = "全部";
  $("chips").innerHTML = list.map(function(c){
    var n = c === "全部" ? pool.length : pool.filter(function(t){ return t.cat === c; }).length;
    return '<button type="button" class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + "<small>" + n + "</small></button>";
  }).join("");
  $("cat-list").innerHTML = cats().map(function(c){ return '<option value="' + esc(c) + '">'; }).join("");
}
function render(){
  renderChips();
  var ql = q.trim().toLowerCase();
  var shown = tools.map(function(t, i){ return { t: t, i: i }; }).filter(function(o){
    var t = o.t;
    return inWho(t) && (cat === "全部" || t.cat === cat) && (!ql || (t.name + " " + t.desc + " " + t.cat + " " + t.who).toLowerCase().indexOf(ql) >= 0);
  });
  function card(o){
    var t = o.t, i = o.i;
    return '<article class="card"><div class="top"><div class="mark" style="background:' + colorOf(t.cat) + '" aria-hidden="true">' + esc(initial(t.name)) + '</div><div>' +
      "<h3 class=\"tn\">" + esc(t.name) + '</h3><div class="tags"><span class="tag who">' + esc(t.who || "學生用") + "</span>" + (t.cat ? '<span class="tag">' + esc(t.cat) + "</span>" : "") + "</div></div></div>" +
      (t.desc ? "<p>" + esc(t.desc) + "</p>" : "") +
      '<div class="foot"><a class="open" href="' + esc(safeUrl(t.url)) + '" target="_blank" rel="noopener">打開 ↗</a>' +
      '<div class="ed"><button type="button" class="btn" data-act="up" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="往前移">↑</button>' +
      '<button type="button" class="btn" data-act="down" data-i="' + i + '"' + (i === tools.length - 1 ? " disabled" : "") + ' aria-label="往後移">↓</button>' +
      '<button type="button" class="btn" data-act="edit" data-i="' + i + '">編輯</button>' +
      '<button type="button" class="btn warn" data-act="del" data-i="' + i + '">刪除</button></div></div></article>';
  }
  var order = cats();
  var groups = (who === "全部" ? whos() : [who]).map(function(w){
    var items = shown.filter(function(o){ return (o.t.who || "學生用") === w; })
      .sort(function(a, b){ return (order.indexOf(a.t.cat) - order.indexOf(b.t.cat)) || (a.i - b.i); });
    return { w: w, items: items };
  }).filter(function(g){ return g.items.length; });
  $("grid").innerHTML = groups.length ? groups.map(function(g){
    return '<section class="grp"><h2 class="grp-h">' + esc(g.w) + "<small>" + g.items.length + " 個工具</small></h2><div class=\"grid\">" + g.items.map(card).join("") + "</div></section>";
  }).join("") : '<div class="empty">' + (tools.length ? "找不到符合的工具。" : "還沒有工具。按下方「管理工具」→「新增工具」加入第一個。") + "</div>";
  $("app").classList.toggle("managing", managing);
  $("m-save").hidden = !managing; $("m-add").hidden = !managing;
  $("m-toggle").textContent = managing ? "完成管理" : "管理工具";
  $("manage-note").innerHTML = managing ? "可以新增、編輯、排序或刪除工具，改完按「儲存網站」。" + (dirty ? '<span class="unsaved">尚未儲存</span>' : "") : "只有你看得到這一區。";
}
$("who-chips").addEventListener("click", function(e){ var b = e.target.closest(".chip"); if (!b) return; who = b.dataset.who; cat = "全部"; try { sessionStorage.setItem("tb-who", who); sessionStorage.setItem("tb-cat", cat); } catch(x) {} render(); });
$("chips").addEventListener("click", function(e){ var b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.cat; try { sessionStorage.setItem("tb-cat", cat); } catch(x) {} render(); });
$("q").addEventListener("input", function(){ q = this.value; render(); });

/* manage */
var delArm = {};
$("grid").addEventListener("click", function(e){
  var b = e.target.closest("button[data-act]"); if (!b || !managing) return;
  var i = +b.dataset.i, a = b.dataset.act;
  if (a === "up" && i > 0){ var x = tools[i-1]; tools[i-1] = tools[i]; tools[i] = x; dirty = true; render(); }
  else if (a === "down" && i < tools.length - 1){ var y = tools[i+1]; tools[i+1] = tools[i]; tools[i] = y; dirty = true; render(); }
  else if (a === "edit") openForm(i);
  else if (a === "del"){
    if (!delArm[i] || Date.now() - delArm[i] > 3000){ delArm[i] = Date.now(); b.textContent = "再按一次刪除"; setTimeout(function(){ if (b.isConnected) b.textContent = "刪除"; }, 3000); return; }
    tools.splice(i, 1); delArm = {}; dirty = true; render(); status("已從清單移除，記得按「儲存網站」。");
  }
});
function openForm(i){
  editIdx = i; var t = i >= 0 ? tools[i] : { name: "", url: "", cat: cat !== "全部" ? cat : "", who: "學生用", desc: "" };
  $("form-title").textContent = i >= 0 ? "編輯工具" : "新增工具";
  $("f-submit").textContent = i >= 0 ? "更新" : "加入清單";
  $("f-name").value = t.name; $("f-url").value = t.url; $("f-cat").value = t.cat; $("f-who").value = t.who || "學生用"; $("f-desc").value = t.desc;
  $("form-panel").hidden = false; $("form-panel").scrollIntoView({ behavior: "smooth", block: "start" }); $("f-name").focus();
}
$("tool-form").addEventListener("submit", function(e){
  e.preventDefault();
  var url = $("f-url").value.trim();
  if (!/^https?:\/\//i.test(url)) { status("連結要用 https:// 開頭。", "err"); $("f-url").focus(); return; }
  var t = { name: $("f-name").value.trim(), url: url, cat: $("f-cat").value.trim(), who: $("f-who").value, desc: $("f-desc").value.trim() };
  if (!t.name) { $("f-name").focus(); return; }
  if (editIdx >= 0) tools[editIdx] = t; else tools.push(t);
  dirty = true; $("form-panel").hidden = true; render();
  status((editIdx >= 0 ? "已更新" : "已加入") + "「" + t.name + "」，記得按「儲存網站」。", "ok");
});
$("f-cancel").addEventListener("click", function(){ $("form-panel").hidden = true; });
$("m-toggle").addEventListener("click", function(){ managing = !managing; if (!managing) $("form-panel").hidden = true; render(); });
$("m-add").addEventListener("click", function(){ openForm(-1); });

/* save: the page republishes itself with the new list */
var M_TPL = "/*" + "TPL*/null", M_DATA = "/*" + "DATA*/[]";
function js(x){ return JSON.stringify(x).replace(/<\//g, "<\\/").replace(/<!--/g, "<\\!--").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
function buildPage(list){
  var t = SELF_TPL, i = t.indexOf(M_DATA);
  t = t.slice(0, i) + "/*DATA*/" + js(list) + t.slice(i + M_DATA.length);
  var j = t.indexOf(M_TPL);
  t = t.slice(0, j) + "/*TPL*/" + js(SELF_TPL) + t.slice(j + M_TPL.length);
  return SKEL + t + "</body></html>";
}
$("m-save").addEventListener("click", async function(){
  if (!art || !canWrite) { status("這個畫面不能儲存。", "err"); return; }
  var b = this; b.disabled = true; status("正在儲存…");
  try { await art.publish(buildPage(tools)); dirty = false; status("已儲存，頁面會重新載入。", "ok"); }
  catch(err){
    var c = err && err.code;
    if (c === "conflict") status("有新的版本，頁面正在重新載入，請再改一次。", "err");
    else if (c === "rate_limited") status("儲存太頻繁了，請等一下再按。", "err");
    else if (c === "not_writer" || c === "not_granted" || c === "capability_disabled" || c === "not_declared") { canWrite = false; $("manage").hidden = true; managing = false; render(); status("這個畫面只能看，不能儲存。", "err"); }
    else status("儲存失敗，請稍後再試一次。", "err");
  } finally { b.disabled = false; }
});
window.addEventListener("beforeunload", function(e){ if (dirty) { e.preventDefault(); e.returnValue = ""; } });

render();
(async function(){
  try {
    if (window.claude && window.claude.use){
      art = await window.claude.use("artifact");
      var user = await window.claude.use("user");
      canWrite = !!art && !!user && !!(await user.canEdit());
    }
  } catch(e) { canWrite = false; }
  $("manage").hidden = !canWrite;
})();
})();
</script>


</body></html>
